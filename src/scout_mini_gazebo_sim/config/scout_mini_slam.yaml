slam_toolbox:
  ros__parameters:
    use_sim_time: true

    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /scan_2d   # LaserScan になってることが前提

    transform_publish_period: 0.05
    map_update_interval: 1.0

    resolution: 0.05
    max_laser_range: 30.0
